[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ir-engine"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
    "psycopg[binary]>=3.3,<3.4",
    "psycopg-pool>=3.2,<3.4",
    "elasticsearch>=9.5,<10",
    "keyring>=25.7,<26",
    "pydantic>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<0.29",
    "pyyaml>=6",
    "openapi-spec-validator>=0.9,<0.10",
    "jsonschema>=4.23,<5",
    "datamodel-code-generator>=0.87,<0.88",
    "ruff>=0.14",
]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
ir-engine = "ir_engine.cli:main"

[tool.setuptools.packages.find]
include = ["ir_engine*"]

[tool.setuptools.package-data]
ir_engine = ["db/migrations/*.sql", "investigation/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["ir_engine/schemas.py"]

[tool.ruff.lint]
select = ["E9", "F", "B", "I"]
ignore = ["B008"]
